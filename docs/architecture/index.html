<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cassandra Platform — Architecture</title>
<!--
  A VIEW, not a source. This page fetches and renders the markdown files that
  live next to it (README.md, containers.md, components.md, walkthroughs.md).
  Edit those; never this page's content. Published by pages.yml at
  /cassandra-platform/architecture/.
-->
<style>
  :root {
    --bg: #faf9f7; --panel: #ffffff; --ink: #1a1a20; --muted: #6b6b76;
    --line: #e5e2dc; --accent: #7a5af5; --accent-ink: #5a3fd4;
    --code-bg: #f1efe9; --sidebar-w: 264px; --mark: #b8860b;
  }
  [data-theme="dark"] {
    --bg: #14141a; --panel: #1c1c24; --ink: #e8e6f0; --muted: #9b98a8;
    --line: #2c2c38; --accent: #a68bff; --accent-ink: #c0aaff;
    --code-bg: #22222c; --mark: #e0b34d;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
      "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent-ink); text-decoration: none; }
  a:hover { text-decoration: underline; }

  .layout { display: flex; min-height: 100vh; }

  nav.side {
    width: var(--sidebar-w); flex: 0 0 auto; position: sticky; top: 0;
    height: 100vh; overflow-y: auto; padding: 1.4rem 1.1rem 2rem;
    border-right: 1px solid var(--line); background: var(--panel);
  }
  .brand { font-weight: 700; letter-spacing: .01em; font-size: 1.02rem; margin-bottom: .1rem; }
  .brand .dot { color: var(--accent); }
  .tagline { color: var(--muted); font-size: .78rem; margin-bottom: 1.2rem; line-height: 1.4; }
  .navgroup { margin-bottom: 1.1rem; }
  .navgroup h5 {
    margin: 0 0 .35rem; font-size: .68rem; text-transform: uppercase;
    letter-spacing: .09em; color: var(--muted); font-weight: 600;
  }
  nav.side a.pg {
    display: block; padding: .34rem .55rem; border-radius: 7px;
    color: var(--ink); font-size: .9rem; margin: 1px 0;
  }
  nav.side a.pg:hover { background: var(--code-bg); text-decoration: none; }
  nav.side a.pg.active { background: var(--accent); color: #fff; font-weight: 600; }
  nav.side a.pg .num {
    display: inline-block; width: 1.25rem; color: var(--muted); font-size: .78rem;
    font-variant-numeric: tabular-nums;
  }
  nav.side a.pg.active .num { color: rgba(255,255,255,.75); }
  .toc { margin: .2rem 0 0 1.5rem; border-left: 1px solid var(--line); }
  .toc a { display: block; font-size: .8rem; color: var(--muted); padding: .16rem .55rem; }
  .toc a:hover { color: var(--ink); text-decoration: none; }
  .ext { font-size: .82rem; }
  .ext a { color: var(--muted); display: block; padding: .18rem .55rem; }
  .ext a:hover { color: var(--ink); }
  #themeBtn {
    margin-top: 1rem; background: none; border: 1px solid var(--line);
    color: var(--muted); border-radius: 7px; padding: .3rem .7rem;
    font-size: .78rem; cursor: pointer;
  }
  #themeBtn:hover { color: var(--ink); border-color: var(--muted); }

  main { flex: 1 1 auto; min-width: 0; display: flex; justify-content: center; }
  article { width: 100%; max-width: 47.5rem; padding: 2.6rem 2.4rem 5rem; }

  article h1 { font-size: 1.9rem; line-height: 1.25; margin: 0 0 .4rem; letter-spacing: -.015em; }
  article h2 {
    font-size: 1.28rem; margin: 2.4rem 0 .7rem; padding-top: 1.1rem;
    border-top: 1px solid var(--line); letter-spacing: -.01em;
  }
  article h1 + h2, article h1 + p + h2 { border-top: none; }
  article h3 { font-size: 1.02rem; margin: 1.6rem 0 .5rem; }
  article p, article li { color: var(--ink); }
  article li { margin: .25rem 0; }
  article code {
    background: var(--code-bg); border-radius: 5px; padding: .12em .38em;
    font: .85em/1.5 ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  }
  article pre {
    background: var(--code-bg); border: 1px solid var(--line); border-radius: 10px;
    padding: .9rem 1.1rem; overflow-x: auto;
  }
  article pre code { background: none; padding: 0; font-size: .84rem; }
  article blockquote {
    margin: 1rem 0; padding: .6rem 1.1rem; border-left: 3px solid var(--accent);
    background: var(--panel); border-radius: 0 10px 10px 0; color: var(--muted);
  }
  article blockquote p { color: inherit; }
  article table {
    border-collapse: collapse; width: 100%; margin: 1rem 0; font-size: .89rem;
    display: block; overflow-x: auto;
  }
  article th, article td {
    border: 1px solid var(--line); padding: .45rem .7rem; text-align: left;
    vertical-align: top;
  }
  article th { background: var(--code-bg); font-weight: 600; white-space: nowrap; }
  article tr:nth-child(even) td { background: color-mix(in srgb, var(--panel) 55%, var(--bg)); }

  .mermaid-wrap {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 1rem; margin: 1.2rem 0; overflow-x: auto;
    /* diagrams may break out of the text column, centered on it */
    width: min(calc(100vw - var(--sidebar-w) - 5rem), 1100px);
    position: relative; left: 50%; transform: translateX(-50%);
  }
  /* mermaid's own inline max-width (the diagram's natural size) is the cap;
     narrow diagrams stay natural, wide ones shrink to the wrapper, and the
     very-wide get a JS min-width so they pan instead of pixelating */
  .mermaid-wrap svg { display: block; margin: 0 auto; height: auto; }
  @media (max-width: 900px) {
    .mermaid-wrap { width: 100%; left: 0; transform: none; }
  }

  .pagenav {
    display: flex; justify-content: space-between; gap: 1rem;
    margin-top: 3.2rem; padding-top: 1.2rem; border-top: 1px solid var(--line);
  }
  .pagenav a {
    flex: 0 1 48%; border: 1px solid var(--line); border-radius: 10px;
    padding: .7rem 1rem; background: var(--panel);
  }
  .pagenav a:hover { border-color: var(--accent); text-decoration: none; }
  .pagenav .lbl { display: block; font-size: .72rem; color: var(--muted); }
  .pagenav .next { text-align: right; margin-left: auto; }

  .loading, .fail { color: var(--muted); padding: 4rem 0; text-align: center; }

  h2 .anchor { opacity: 0; margin-left: .35rem; font-size: .8em; }
  h2:hover .anchor { opacity: .6; }

  @media (max-width: 900px) {
    .layout { flex-direction: column; }
    nav.side { position: static; width: 100%; height: auto; border-right: none;
      border-bottom: 1px solid var(--line); }
    .toc { display: none; }
    article { padding: 1.6rem 1.2rem 4rem; }
  }
</style>
</head>
<body>
<div class="layout">
  <nav class="side">
    <div class="brand">Cassandra Platform<span class="dot">.</span></div>
    <div class="tagline">The compliance policy and the running system are the same artifact. A C4-style tour.</div>
    <div class="navgroup">
      <h5>The tour</h5>
      <a class="pg" data-page="overview" href="#/overview"><span class="num">1</span>Context</a>
      <div class="toc" id="toc-overview"></div>
      <a class="pg" data-page="containers" href="#/containers"><span class="num">2</span>Containers</a>
      <div class="toc" id="toc-containers"></div>
      <a class="pg" data-page="components" href="#/components"><span class="num">3</span>Components</a>
      <div class="toc" id="toc-components"></div>
      <a class="pg" data-page="walkthroughs" href="#/walkthroughs"><span class="num">4</span>Walkthroughs</a>
      <div class="toc" id="toc-walkthroughs"></div>
    </div>
    <div class="navgroup ext">
      <h5>Live evidence</h5>
      <a href="../dashboard/">Compliance dashboard</a>
      <a href="https://github.com/Cassandra-Labs-Foundation/cassandra-platform/blob/main/STATE.md">STATE.md — the numbers</a>
      <a href="https://github.com/Cassandra-Labs-Foundation/cassandra-platform">Repository</a>
    </div>
    <button id="themeBtn">◐ theme</button>
  </nav>
  <main><article id="content"><div class="loading">loading…</div></article></main>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked@15/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
<script>
const PAGES = [
  { id: "overview",     file: "README.md",       title: "Context" },
  { id: "containers",   file: "containers.md",   title: "Containers" },
  { id: "components",   file: "components.md",   title: "Components" },
  { id: "walkthroughs", file: "walkthroughs.md", title: "Walkthroughs" },
];
const REPO = "https://github.com/Cassandra-Labs-Foundation/cassandra-platform/blob/main/";
const mdCache = {};

function theme() { return document.documentElement.dataset.theme ||
  (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"); }

function initMermaid() {
  // No font overrides: mermaid must measure labels with the same font it
  // renders, or node text clips.
  mermaid.initialize({
    startOnLoad: false, securityLevel: "loose",
    theme: theme() === "dark" ? "dark" : "neutral",
  });
}

// .md hrefs: sibling pages route in-app; everything else goes to the repo.
function rewriteHref(href) {
  if (!href || /^(https?:|#|mailto:)/.test(href)) return href;
  const base = href.split("#")[0];
  const page = PAGES.find(p => base === p.file || base === "./" + p.file);
  if (page) return "#/" + page.id;
  if (base.endsWith(".md") || base.endsWith("/")) {
    // resolve relative to docs/architecture/ inside the repo
    const parts = ("docs/architecture/" + base).split("/");
    const out = [];
    for (const part of parts) {
      if (part === "..") out.pop(); else if (part !== ".") out.push(part);
    }
    return REPO + out.join("/");
  }
  return href;
}

const slug = t => t.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");

async function load(id) {
  const page = PAGES.find(p => p.id === id) || PAGES[0];
  document.querySelectorAll("nav .pg").forEach(a =>
    a.classList.toggle("active", a.dataset.page === page.id));
  const art = document.getElementById("content");
  try {
    if (!mdCache[page.file]) {
      const r = await fetch(page.file, { cache: "no-store" });
      if (!r.ok) throw new Error(r.status);
      mdCache[page.file] = await r.text();
    }
  } catch (e) {
    art.innerHTML = `<div class="fail">Could not load <code>${page.file}</code> — read it
      <a href="${REPO}docs/architecture/${page.file}">on GitHub</a>.</div>`;
    return;
  }

  // marked v13+ renderer API: methods receive token objects, `this.parser`
  // renders inline children. Keep them `function`s so `this` binds.
  const renderer = {
    link({ href, title, tokens }) {
      const text = this.parser.parseInline(tokens);
      return `<a href="${rewriteHref(href)}"${title ? ` title="${title}"` : ""}>${text}</a>`;
    },
    heading({ tokens, depth }) {
      const inner = this.parser.parseInline(tokens);
      const plain = tokens.map(t => t.text ?? t.raw ?? "").join("");
      const s = slug(plain);
      return depth === 2
        ? `<h2 id="${s}">${inner}<a class="anchor" href="#/${page.id}/${s}">#</a></h2>`
        : `<h${depth} id="${s}">${inner}</h${depth}>`;
    },
    code({ text, lang }) {
      const esc = text.replace(/&/g, "&amp;").replace(/</g, "&lt;");
      return lang === "mermaid"
        ? `<div class="mermaid-wrap"><pre class="mermaid">${esc}</pre></div>`
        : `<pre><code>${esc}</code></pre>`;
    },
  };

  const parser = new marked.Marked({ renderer });
  art.innerHTML = parser.parse(mdCache[page.file]);

  // per-page TOC in the sidebar
  document.querySelectorAll(".toc").forEach(t => (t.innerHTML = ""));
  const toc = document.getElementById("toc-" + page.id);
  art.querySelectorAll("h2").forEach(h => {
    const a = document.createElement("a");
    a.textContent = h.textContent.replace(/#$/, "");
    a.href = "#/" + page.id + "/" + h.id;
    toc.appendChild(a);
  });

  // prev / next
  const i = PAGES.indexOf(page);
  const nav = document.createElement("div");
  nav.className = "pagenav";
  nav.innerHTML =
    (i > 0 ? `<a href="#/${PAGES[i-1].id}"><span class="lbl">← previous</span>${PAGES[i-1].title}</a>` : "<span></span>") +
    (i < PAGES.length - 1 ? `<a class="next" href="#/${PAGES[i+1].id}"><span class="lbl">next →</span>${PAGES[i+1].title}</a>` : "");
  art.appendChild(nav);

  initMermaid();
  await mermaid.run({ nodes: art.querySelectorAll(".mermaid") });

  // A diagram much wider than its wrapper pans at natural size instead of
  // shrinking into an unreadable thumbnail.
  art.querySelectorAll(".mermaid-wrap svg").forEach(svg => {
    const vb = (svg.getAttribute("viewBox") || "").split(" ");
    const natural = parseFloat(vb[2] || 0);
    const box = svg.closest(".mermaid-wrap").clientWidth;
    if (natural > box * 1.35) svg.style.minWidth = Math.min(natural, 1700) + "px";
  });

  const anchor = location.hash.split("/")[2];
  (anchor && document.getElementById(anchor))
    ? document.getElementById(anchor).scrollIntoView()
    : window.scrollTo(0, 0);
}

function route() {
  const [, id] = location.hash.split("/");
  load(id || "overview");
}
window.addEventListener("hashchange", route);

document.getElementById("themeBtn").onclick = () => {
  const next = theme() === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem("arch-theme", next); } catch {}
  route(); // re-render so mermaid picks up the theme
};
try {
  const saved = localStorage.getItem("arch-theme");
  if (saved) document.documentElement.dataset.theme = saved;
} catch {}

route();
</script>
</body>
</html>
