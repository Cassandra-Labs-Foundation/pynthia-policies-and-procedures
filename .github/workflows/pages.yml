# Publish the compliance dashboard to GitHub Pages.
#
# Pages can only serve from the repo root or a directory literally named
# `docs/`. The dashboard now lives at compliance/dashboard/, which is neither,
# so the old "deploy from branch" source cannot see it — this workflow replaces
# it (repo Pages source switched from `legacy` to `workflow`).
#
# The staging step is what keeps the public URL unchanged. Uploading
# compliance/dashboard/ directly would serve it at the site ROOT, moving the
# dashboard from /cassandra-platform/dashboard/ to /cassandra-platform/ and
# breaking every link in docs/demo-runbook.md, the API's /compliance/dashboard redirect and
# the e2e smoke test. Staging it one level down preserves the old path exactly.
#
# It also publishes ONLY the dashboard and the architecture tour. Pointing
# Pages at compliance/ wholesale would publish the 27 policy folders as a
# website too — they are already public on GitHub, but that is a different
# thing from hosting them.
#
# /architecture/ is docs/architecture/ verbatim: index.html is a client-side
# VIEW that fetches and renders the sibling markdown, so the published site
# can never drift from the files in the repo.
name: pages

on:
  push:
    branches: [main]
    paths:
      - "compliance/dashboard/**"
      - "docs/architecture/**"
      - "docs/pages-root.html"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; let an in-flight one finish rather than
# publishing a half-built site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Stage the dashboard and the architecture tour one level down
        run: |
          set -euo pipefail
          mkdir -p _site/dashboard _site/architecture
          cp -R compliance/dashboard/. _site/dashboard/
          cp docs/architecture/index.html docs/architecture/*.md _site/architecture/
          cp docs/pages-root.html _site/index.html   # the bare URL routes, not 404s
          # Fail loudly rather than deploying an empty site.
          test -f _site/index.html
          test -f _site/dashboard/index.html
          test -f _site/dashboard/assets/app.js
          test -f _site/architecture/index.html
          test -f _site/architecture/README.md
          echo "staged $(find _site -type f | wc -l) files"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
