# Phase-0 gate (cards 01/05/06): every push must typecheck, pass the hermetic
# suite, keep floats off the money path, and apply the full migration chain to
# a clean database. The compliance harness (live Blnk) runs from smoke.yml.
name: core-ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Typecheck every function entrypoint
        run: |
          deno check core/supabase/functions/api/index.ts
          deno check core/supabase/functions/blnk-webhook/index.ts
          deno check core/supabase/functions/blnk-reconcile/index.ts
          deno check core/supabase/functions/aggregator/index.ts
      - name: Hermetic suite (unit + behavioral)
        # --allow-read is load-bearing: drill/fake_db.ts derives column
        # defaults and NULL backfill by PARSING core/supabase/migrations/*.sql at
        # test time. Without read permission it silently degrades to empty
        # maps and two dozen null-vs-undefined assertions fail.
        run: deno test --allow-net --allow-env --allow-read core/supabase/functions/
      - name: Drill regression gate — a case that passed yesterday must pass today
        run: deno run --allow-all core/supabase/functions/drill/run.ts --check

      - name: Decision refs resolve — no DN cites a decision the log lacks
        # The code justifies its shape by citing architecture decisions ("per
        # D4", "(D23)"). Before the consolidation the log lived in another repo
        # and those citations resolved to nothing. Now they must resolve, so a
        # renumbered or deleted decision breaks the build instead of quietly
        # leaving 326 comments pointing at nothing.
        run: python3 scripts/check_decision_refs.py --strict

      - name: Vocabulary drift — no policy may cite a code the core dropped
        # The compliance system assumes every `entity.event` in a policy resolves
        # to something core-api.yaml implements. Rename or drop one and the
        # obligation stays written down with nothing behind it.
        #
        # Ratchets against vocab-drift-baseline.json rather than demanding zero:
        # 59 codes already resolve nowhere, and a gate that starts red is a gate
        # nobody reads. Only NEW ones fail. Shrink the baseline, never grow it.
        run: python3 scripts/check_vocab_drift.py --check

      - name: Cursor columns are NOT NULL — no page may end on a dead cursor
        # D16 reads next_after off the last row it serves, so a nullable cursor
        # column yields has_more:true with next_after:null — a 200 nobody can
        # paginate. GET /accounts shipped that way. The check discovers cursor
        # sites from the code rather than a list, so a new list endpoint on a
        # nullable column fails here instead of in production.
        run: python3 scripts/check_cursor_columns.py --strict

      - name: Route parity — spec paths and the router must agree exactly
        # The 2026-08 postmortem gate: paths drifted to 119 phantom operations
        # and 345 undocumented routes because nothing failed when it lied.
        run: python3 scripts/check_route_parity.py

      - name: Emitted coverage — no emitted code may be missing from x-events
        # Inverse of the drift gate above: every code the core can emit must be
        # registered in the spec's x-events, or reachability is measured across
        # a vocabulary gap. Stdlib-only, reads the built core-vocabulary.json.
        run: python3 scripts/check_emitted_coverage.py

      - name: Crosswalk integrity — no over-claims, no stale catalogue ids
        run: python3 scripts/build_crosswalk.py --check

      - name: Dashboard hierarchy matches the catalogue
        run: python3 scripts/build_dashboard.py --check

      - name: Float guard — amounts are integer minor units, everywhere
        run: |
          set -e
          # no float parsing anywhere near the functions
          if grep -rnE "parseFloat" core/supabase/functions --include='*.ts' | grep -v ".test.ts"; then
            echo "::error::parseFloat on the money path"; exit 1
          fi
          # no float math on amounts outside explicitly-marked display code
          if grep -rnE "(amount|cents)[a-zA-Z_]*.*(/ *100[^0-9]|toFixed)" core/supabase/functions --include='*.ts' \
            | grep -v ".test.ts" | grep -v "float-ok" | grep -v "precision"; then
            echo "::error::float arithmetic on an amount; serialize integer minor units"; exit 1
          fi

  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Apply the full migration chain to a clean database
        # --workdir: the CLI locates a project by finding supabase/config.toml
        # relative to the working directory, and the project now lives at
        # core/supabase/. Without this the CLI reports "no project found" rather
        # than applying anything — a green-looking skip, not a failure.
        run: |
          supabase db start --workdir core
          supabase db reset --no-seed --workdir core || supabase db reset --workdir core

  pgtap:
    # Constraint BEHAVIOR — the guarantees docs/drill.md documents as invisible
    # to the hermetic drill (FKs, UNIQUEs, the freeze_* immutability triggers,
    # NOT NULL partner_id + FK to core.partner), exercised against the real
    # migrated schema. Non-destructive by construction: without --linked or
    # --db-url, `supabase test db` connects only to the shadow database that
    # `supabase db start` runs in Docker on this runner (the CLI joins the
    # local docker network and installs pgtap itself before invoking pg_prove).
    # The linked project is never touched.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Constraints refuse what the drill cannot even represent
        # 04 and 05 are passed EXPLICITLY rather than running the whole tests/
        # dir: pg_prove -r would also pick up 90_deadline_monitors.sql (plain
        # SQL, no TAP plan) and the generated 00-03 files, which currently fail
        # against the migrated schema (their seed inserts omit NOT NULL
        # columns like partner_id, and ach_transfer.id is uuid in the schema
        # but text in the model). Widen this to the generated files once
        # gen_tests.py seeds valid rows.
        #
        # 05 covers the FBO direction model (TODO §6). It is here rather than
        # in the Deno suite because the arithmetic lives in pl/pgsql: the hub's
        # sign error survived a year of green CI precisely because its only
        # coverage asserted which RPC was dispatched, not what it computed.
        run: |
          supabase db start --workdir core
          supabase db reset --no-seed --workdir core || supabase db reset --workdir core
          supabase test db --workdir core \
            core/supabase/tests/04_constraint_behavior.test.sql \
            core/supabase/tests/05_fbo_direction.test.sql
