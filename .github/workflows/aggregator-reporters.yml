# Cards 59/60/62 — the SCHEDULED half of the reporters' Done criteria.
#
# Daily: archive events to Parquet (card 62's watermark sync), run the BSA
# 90-day lookback (59) and the 5300 aggregation (60). Evidence rows land in
# Postgres; new Parquet files are committed back to main, making git the
# cold archive of record (versioned, tamper-evident — a records-retention
# property, not just a storage choice).
#
# Requires the SUPABASE_DB_URL secret (session-pooler URI). Until it is set
# the job reports itself skipped rather than failing the schedule.
name: aggregator-reporters
on:
  schedule:
    - cron: "17 6 * * *" # daily 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reporters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

